<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0,
          maximum-scale=1.0, user-scalable=no"
    />

    <!-- iOS Home Screen behaviour -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Adventure Island" />

    <!-- App icons (multiple resolutions) -->
    <link rel="apple-touch-icon" href="../images/home3.png" />

    <link rel="manifest" href="manifest.json" />

    <title>Adventure Island 4 Listening</title>

    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }

      :root {
        --font-chalk:
          "Chalkboard SE", "Comic Sans MS", "Segoe Print", sans-serif;
        --colour-btn-face: #ffd600;
        --colour-btn-active: #ffc200;
        --colour-btn-border: #000000;
        --colour-heading-text: orange;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow-x: hidden;
        max-width: 100vw;
      }

      body {
        font-family: var(--font-chalk);
        background-color: #30b0c7;
        background-size: cover;
        background-position: center center;
        background-repeat: no-repeat;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        min-height: 100vh;
        min-height: 100dvh;
        overflow: hidden;
      }

      h1 {
        font-family: var(--font-chalk);
        color: var(--colour-heading-text);
        width: 100%;
        text-align: center;
        letter-spacing: 0.03em;
        flex-shrink: 0;
        -webkit-text-stroke: 2px yellow;
      }

      .grid-wrapper {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        min-height: 0;
      }

      .btn {
        font-family: var(--font-chalk);
        font-weight: bold;
        color: yellow;
        background: #28756d;
        border: 2px solid var(--colour-btn-border);
        border-radius: 10px;
        text-decoration: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        overflow: hidden;
        -webkit-user-select: none;
        user-select: none;
        -webkit-text-stroke: 2px darkorange;
        transition:
          transform 0.1s ease,
          background 0.15s ease;
      }

      .btn:active {
        transform: scale(0.97);
        background: var(--colour-btn-active);
      }

      .back-btn {
        position: fixed;
        top: max(16px, env(safe-area-inset-top, 16px));
        left: max(16px, env(safe-area-inset-left, 16px));
        z-index: 60;
        display: flex;
        align-items: center;
        gap: 0.3em;
        background: var(--colour-btn-face);
        color: var(--colour-btn-border);
        border: 2px solid var(--colour-btn-border);
        border-radius: 999px;
        padding: 0.4em 0.9em;
        font-family: var(--font-chalk);
        font-weight: bold;
        font-size: 1rem;
        text-decoration: none;
        cursor: pointer;
        -webkit-text-stroke: 0;
        transition: transform 0.1s ease;
      }
      .back-btn:active {
        transform: translateY(2px);
        background: var(--colour-btn-active);
      }

      /* LANDSCAPE: 3 buttons on top, 2 centred underneath */
      @media screen and (orientation: landscape) {
        body {
          background-image: url("images/bg_land4.png");
          background-size: cover;
          background-position: center center;
          background-repeat: no-repeat;
          overflow: hidden;
        }

        h1 {
          font-size: clamp(2rem, 6vw, 5rem);
          padding: 0.1em 0.5em;
          margin-top: 4vh;
        }

        .grid-wrapper {
          padding: 1vh 2vw 4vh;
        }

        .grid {
          display: grid;
          grid-template-columns: repeat(6, 1fr);
          gap: clamp(8px, 2vw, 24px);
          width: min(94vw, 920px);
        }

        .btn {
          grid-column: span 2;
          font-size: clamp(1rem, 4.5vw, 3.2rem);
          height: clamp(60px, 24vh, 150px);
        }
        .btn:nth-child(4) {
          grid-column: 2 / span 2;
        }
        .btn:nth-child(5) {
          grid-column: 4 / span 2;
        }
      }

      /* LANDSCAPE IPHONE */
      @media screen and (orientation: landscape) and (max-height: 450px) {
        body {
          width: 100vw !important;
          min-width: 100vw !important;
          overflow-x: hidden !important;
        }

        h1 {
          font-size: clamp(1rem, 6vw, 3rem) !important;
          padding: 0.1em 0.5em !important;
          margin-top: 1vh !important;
        }

        .grid-wrapper {
          padding: 1vh 6vw 2vh;
        }

        .btn {
          height: clamp(40px, 26vh, 90px) !important;
          font-size: clamp(0.9rem, 4vw, 2.4rem) !important;
        }
      }

      /* PORTRAIT: 2 columns, last button centred */
      @media screen and (orientation: portrait) {
        body {
          overflow-y: auto;
          background-image: url("images/bg_port4.png");
          background-size: cover;
          background-position: center center;
          background-repeat: no-repeat;
        }

        h1 {
          font-size: clamp(1.5rem, 12vw, 4rem);
          padding: 0.3em 0.5em;
          margin-top: 50px;
        }

        .grid-wrapper {
          padding: 2vw 9vw 16vw;
        }

        .grid {
          display: grid;
          grid-template-columns: repeat(4, 1fr);
          gap: clamp(14px, 5vw, 40px);
          width: 100%;
          max-width: 520px;
        }

        .btn {
          grid-column: span 2;
          font-size: clamp(1rem, 7vw, 3rem);
          height: clamp(70px, 24vw, 200px);
        }
        .btn:nth-child(5) {
          grid-column: 2 / span 2;
        }
      }

      /* PORTRAIT IPHONE */
      @media screen and (orientation: portrait) and (max-width: 430px) {
        h1 {
          font-size: clamp(1.1rem, 9vw, 3rem) !important;
          padding: 0.3em 0.5em !important;
          line-height: 1;
          margin-top: max(50px, env(safe-area-inset-top, 50px)) !important;
        }

        .grid-wrapper {
          padding: 3vh 7vw 22vw !important;
        }

        .grid {
          gap: 18px !important;
        }

        .btn {
          height: clamp(70px, 26vw, 120px) !important;
          font-size: clamp(0.9rem, 6.5vw, 2.2rem) !important;
        }
      }
    </style>
  </head>

  <body>
    <a class="back-btn" href="index.html">← Back</a>
    <h1>Adventure Island 4 Listening</h1>

    <div class="grid-wrapper">
      <div class="grid" id="audio-grid">
        <a class="btn" href="listening4-player.html?page=34">Page 34</a>
        <a class="btn" href="listening4-player.html?page=42">Test 1</a>
        <a class="btn" href="listening4-player.html?page=68">Page 68</a>
        <a class="btn" href="listening4-player.html?page=72">Page 72</a>
        <a class="btn" href="listening4-player.html?page=78">Test 2</a>
      </div>
    </div>
  </body>
</html>
