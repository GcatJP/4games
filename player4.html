<!doctype html>
<html lang="en">
  <!-- ============================================================
     ADVENTURE ISLAND — player4.html (blue theme)
     ============================================================
     Usage:  player4.html?lib=586241&v=VIDEO-ID&back=Units4_1-10.html

     CUSTOMISE THIS SECTION:
       • HOSTS  — Bunny library ID -> pull zone hostname
       • --bg   — background colour (matches the Units4 page)

     CONTROLS:
       • Tap the screen  → play / pause
       • Bottom-left btn → fullscreen
       • Bottom bar      → progress (tap or drag to seek)
     ============================================================ -->

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0,
          maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Video</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>

    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }

      :root {
        --font-chalk:
          "Chalkboard SE", "Comic Sans MS", "Segoe Print", sans-serif;
        --bg: #30b0c7;
        --tone-dark: #3f81a9;
        --tone-mid: #7ab8d9;
        --tone-light: #c7e3f4;
        --colour-btn-border: #000000;
        --ctrl-h: clamp(48px, 9vh, 72px);
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      body {
        font-family: var(--font-chalk);
        background: var(--bg);
        background-size: cover;
        background-position: center center;
        background-repeat: no-repeat;
        height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(env(safe-area-inset-top), 4px)
          max(env(safe-area-inset-right), 4px)
          max(env(safe-area-inset-bottom), 4px)
          max(env(safe-area-inset-left), 4px);
        -webkit-user-select: none;
        user-select: none;
      }

      @media (orientation: landscape) {
        body {
          background-image: url("./images/bg_land4.png");
        }
      }
      @media (orientation: portrait) {
        body {
          background-image: url("./images/bg_port4.png");
        }
      }

      /* ----------------------------------------------------------
         SHARED BUTTON LOOK (same as units.html)
      ---------------------------------------------------------- */
      .btn {
        font-family: var(--font-chalk);
        font-weight: bold;
        color: yellow;
        -webkit-text-stroke: 2px orange;
        background: var(--tone-dark);
        border: 2px solid var(--colour-btn-border);
        border-radius: 10px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        transition:
          transform 0.1s ease,
          opacity 0.15s ease;
      }
      .btn:active {
        transform: scale(0.97);
        opacity: 0.85;
      }
      .btn:focus-visible {
        outline: 3px solid yellow;
        outline-offset: 2px;
      }

      /* ----------------------------------------------------------
         BACK BUTTON — fixed to the top-left corner of the screen
      ---------------------------------------------------------- */
      .back {
        position: fixed;
        top: max(env(safe-area-inset-top), 8px);
        left: max(env(safe-area-inset-left), 8px);
        z-index: 20;
        width: var(--ctrl-h);
        height: calc(var(--ctrl-h) * 0.8);
        font-size: clamp(1.4rem, 6vh, 3rem);
        background: rgba(0, 0, 0, 0.4);
        border-color: yellow;
      }

      /* ----------------------------------------------------------
         STAGE = frame + controls (this is what goes fullscreen)
      ---------------------------------------------------------- */
      .stage {
        width: var(--stage-w);
        display: flex;
        flex-direction: column;
        gap: clamp(8px, 2vh, 16px);
      }

      .frame {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
        background: #000;
        border: clamp(5px, 1.2vw, 12px) solid var(--tone-light);
        border-radius: 18px;
        outline: 3px solid var(--colour-btn-border);
        box-shadow:
          0 0 0 clamp(3px, 0.6vw, 6px) var(--tone-dark),
          0 6px 18px rgba(0, 0, 0, 0.45);
        overflow: hidden;
        cursor: pointer;
        touch-action: manipulation;
      }
      .frame:focus-visible {
        outline-color: yellow;
      }
      video {
        width: 100%;
        height: 100%;
        display: block;
        background: #000;
        object-fit: contain;
      }

      /* ----------------------------------------------------------
         START COVER — black screen with play/pause icons + label
         (disappears on the first play and never comes back)
      ---------------------------------------------------------- */
      .cover {
        position: absolute;
        inset: 0;
        background: #000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: clamp(6px, 2vh, 18px);
        color: yellow;
        font-weight: bold;
        -webkit-text-stroke: 1.5px orange;
        z-index: 2;
      }
      .cover.hide {
        display: none;
      }
      .cover-icons {
        display: flex;
        align-items: center;
        gap: clamp(14px, 4vw, 40px);
      }
      .cover-icons svg {
        width: clamp(2rem, min(9vw, 16vh), 7rem);
        height: clamp(2rem, min(9vw, 16vh), 7rem);
        fill: yellow;
        stroke: orange;
        stroke-width: 1.5;
        stroke-linejoin: round;
      }
      .cover-text {
        font-size: clamp(1.2rem, min(5vw, 9vh), 3.5rem);
      }

      .msg {
        position: absolute;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 1rem;
        color: yellow;
        -webkit-text-stroke: 0.6px orange;
        font-weight: bold;
        font-size: clamp(1rem, 3vw, 2rem);
        background: rgba(0, 0, 0, 0.75);
        z-index: 3;
      }
      .msg.show {
        display: flex;
      }

      /* ----------------------------------------------------------
         CONTROLS (fullscreen button + progress bar)
      ---------------------------------------------------------- */
      .controls {
        width: 100%;
        height: var(--ctrl-h);
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: clamp(8px, 2vw, 16px);
      }
      .fs-btn {
        flex: 0 0 auto;
        width: calc(var(--ctrl-h) * 1.4);
        height: 100%;
      }
      .fs-btn svg {
        width: 55%;
        height: 55%;
        fill: none;
        stroke: yellow;
        stroke-width: 3;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .bar {
        flex: 1;
        height: 100%;
        display: flex;
        align-items: center;
        cursor: pointer;
        touch-action: none;
      }
      .track {
        position: relative;
        width: 100%;
        height: clamp(16px, 3.2vh, 26px);
        background: rgba(0, 0, 0, 0.45);
        border: 2px solid var(--colour-btn-border);
        border-radius: 999px;
        overflow: hidden;
      }
      .fill {
        position: absolute;
        inset: 0 auto 0 0;
        width: 0%;
        background: linear-gradient(
          to bottom,
          var(--tone-light),
          var(--tone-mid)
        );
        border-right: 2px solid yellow;
      }
      .bar:focus-visible .track {
        outline: 3px solid yellow;
        outline-offset: 2px;
      }

      /* ----------------------------------------------------------
         FULLSCREEN STATE (class added by script)
      ---------------------------------------------------------- */
      .stage.fs {
        width: 100%;
        height: 100%;
        background: #000;
        gap: 8px;
        padding: max(env(safe-area-inset-top), 6px)
          max(env(safe-area-inset-right), 10px)
          max(env(safe-area-inset-bottom), 6px)
          max(env(safe-area-inset-left), 10px);
      }
      .stage.fs .frame {
        flex: 1;
        min-height: 0;
        aspect-ratio: auto;
        border: 0;
        border-radius: 0;
        outline: none;
        box-shadow: none;
      }
    </style>
  </head>

  <body>
    <a class="btn back" id="back" href="units.html" aria-label="Back">←</a>

    <div class="stage" id="stage">
      <div
        class="frame"
        id="frame"
        role="button"
        tabindex="0"
        aria-label="Play/Pause"
      >
        <video id="vid" playsinline webkit-playsinline preload="auto"></video>

        <div class="cover" id="cover">
          <div class="cover-icons">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 3.5 L20 12 L6 20.5 Z" />
            </svg>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="5" y="3.5" width="5" height="17" rx="1" />
              <rect x="14" y="3.5" width="5" height="17" rx="1" />
            </svg>
          </div>
          <div class="cover-text">Play/Pause</div>
        </div>

        <div class="msg" id="msg"></div>
      </div>

      <div class="controls" id="controls">
        <button class="btn fs-btn" id="fsBtn" aria-label="Fullscreen"></button>
        <div
          class="bar"
          id="bar"
          role="slider"
          tabindex="0"
          aria-label="Progress"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
        >
          <div class="track"><div class="fill" id="fill"></div></div>
        </div>
      </div>
    </div>

    <script>
      // Bunny library ID -> pull zone hostname
      var HOSTS = {
        586241: "vz-657073d7-6c7.b-cdn.net",
        586195: "vz-fa66c312-913.b-cdn.net",
      };

      var params = new URLSearchParams(location.search);
      var lib = params.get("lib");
      var vid = params.get("v");
      var back = params.get("back");

      var video = document.getElementById("vid");
      var stage = document.getElementById("stage");
      var frame = document.getElementById("frame");
      var cover = document.getElementById("cover");
      var controls = document.getElementById("controls");
      var backBtn = document.getElementById("back");
      var fsBtn = document.getElementById("fsBtn");
      var bar = document.getElementById("bar");
      var fill = document.getElementById("fill");
      var msg = document.getElementById("msg");

      // Back button: only accept a plain local filename
      if (back && /^[\w\-.]+\.html$/.test(back)) {
        backBtn.href = back;
      }

      /* ---- size the stage as large as possible ----
         The back button sits in the screen corner, so it only costs
         space when the frame would otherwise run underneath it. */
      function sizeStage() {
        var vw = window.innerWidth;
        var vh = window.innerHeight;
        var ctrlH = controls.offsetHeight || 56;
        var gap = Math.min(Math.max(vh * 0.02, 8), 16);
        var pad = 8;

        var w = Math.min(
          vw - pad * 2,
          (vh - ctrlH - gap - pad * 2) * (16 / 9),
          1600,
        );

        var b = backBtn.getBoundingClientRect();
        var side = (vw - w) / 2;
        if (side < b.width + 12) {
          var w2 = (vh - ctrlH - gap - 2 * (b.height + 12)) * (16 / 9);
          w = Math.min(w, w2);
        }

        document.documentElement.style.setProperty(
          "--stage-w",
          Math.max(w, 200) + "px",
        );
      }
      sizeStage();
      window.addEventListener("resize", sizeStage);
      window.addEventListener("orientationchange", function () {
        setTimeout(sizeStage, 200);
      });

      /* ---- load the stream ---- */
      function showError(text) {
        msg.textContent = text;
        msg.classList.add("show");
      }

      var host = HOSTS[lib];
      if (!host || !vid || !/^[0-9a-f-]{36}$/i.test(vid)) {
        showError("Video not found");
      } else {
        var src = "https://" + host + "/" + vid + "/playlist.m3u8";
        if (video.canPlayType("application/vnd.apple.mpegurl")) {
          video.src = src; // Safari / iOS native HLS
        } else if (window.Hls && Hls.isSupported()) {
          var hls = new Hls();
          hls.loadSource(src);
          hls.attachMedia(video);
          hls.on(Hls.Events.ERROR, function (e, data) {
            if (data.fatal) showError("Can't load this video");
          });
        } else {
          showError("This browser can't play the video");
        }
      }
      video.addEventListener("error", function () {
        showError("Can't load this video");
      });

      /* ---- tap the screen = play / pause ---- */
      function toggle() {
        if (video.paused || video.ended) {
          video.play().catch(function () {});
        } else {
          video.pause();
        }
      }
      frame.addEventListener("click", toggle);
      frame.addEventListener("keydown", function (e) {
        if (e.key === " " || e.key === "Enter") {
          e.preventDefault();
          toggle();
        }
      });

      // The start cover goes away on the first play and stays away,
      // so a paused video keeps showing its picture.
      video.addEventListener("play", function () {
        cover.classList.add("hide");
      });

      /* ---- fullscreen ---- */
      var ICON_ENTER =
        '<svg viewBox="0 0 24 24" aria-hidden="true">' +
        '<path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>';
      var ICON_EXIT =
        '<svg viewBox="0 0 24 24" aria-hidden="true">' +
        '<path d="M9 4v5H4M15 4v5h5M20 15h-5v5M4 15h5v5"/></svg>';

      function isFs() {
        return document.fullscreenElement || document.webkitFullscreenElement;
      }
      function updateFs() {
        var on = !!isFs();
        stage.classList.toggle("fs", on);
        fsBtn.innerHTML = on ? ICON_EXIT : ICON_ENTER;
        fsBtn.setAttribute("aria-label", on ? "Exit fullscreen" : "Fullscreen");
      }
      fsBtn.addEventListener("click", function () {
        if (isFs()) {
          (document.exitFullscreen || document.webkitExitFullscreen).call(
            document,
          );
          return;
        }
        var req = stage.requestFullscreen || stage.webkitRequestFullscreen;
        if (req) {
          req.call(stage);
        } else if (video.webkitEnterFullscreen) {
          // iPhone Safari: only the video itself can go fullscreen
          video.webkitEnterFullscreen();
        }
      });
      document.addEventListener("fullscreenchange", updateFs);
      document.addEventListener("webkitfullscreenchange", updateFs);
      updateFs();

      /* ---- progress bar ---- */
      function frac() {
        return video.duration ? video.currentTime / video.duration : 0;
      }
      function draw() {
        var f = frac();
        fill.style.width = f * 100 + "%";
        bar.setAttribute("aria-valuenow", Math.round(f * 100));
      }
      (function loop() {
        draw();
        requestAnimationFrame(loop);
      })();

      var dragging = false;
      function seekTo(clientX) {
        if (!video.duration) return;
        var r = bar.getBoundingClientRect();
        var f = Math.min(Math.max((clientX - r.left) / r.width, 0), 1);
        video.currentTime = f * video.duration;
        draw();
      }
      bar.addEventListener("pointerdown", function (e) {
        dragging = true;
        bar.setPointerCapture(e.pointerId);
        seekTo(e.clientX);
      });
      bar.addEventListener("pointermove", function (e) {
        if (dragging) seekTo(e.clientX);
      });
      ["pointerup", "pointercancel"].forEach(function (ev) {
        bar.addEventListener(ev, function () {
          dragging = false;
        });
      });
      bar.addEventListener("keydown", function (e) {
        if (!video.duration) return;
        if (e.key === "ArrowRight") video.currentTime += 5;
        if (e.key === "ArrowLeft") video.currentTime -= 5;
        if (e.key === " ") {
          e.preventDefault();
          toggle();
        }
      });
    </script>
  </body>
</html>
