<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Right or Wrong" />
    <meta name="theme-color" content="#ffcc00" />
    <title>Adventure Island — Right or Wrong?</title>

    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
      }

      :root {
        --ocean-deep: #0e6e6e;
        --coral: #ff7b54;
        --sun: #ffd23f;
        --white: #fffdf8;
        --orange-dark: #c45a1a;
        --orange-btn: #d4631e;
        --card-border: #0b3d3a;
        --card-bg: #fffdf8;
        --chip-bg: #0e6e6e;
        --chip-border: #e8a020;
        --chip-text: #f6c948;
        --good: #4caf7d;
        --good-dark: #2f7d55;
        --bad: #e0483c;
        --bad-dark: #a8332a;
      }

      .rotate-message {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 100;
        background: #30b0c7;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2em;
      }
      .rotate-message p {
        color: var(--sun);
        -webkit-text-stroke: 0.8px #f4930b;
        font-family:
          "Chalkboard SE", "Comic Sans MS", "Segoe Print", sans-serif;
        font-weight: bold;
        font-size: clamp(1.2rem, 6vw, 2rem);
        line-height: 1.4;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        max-width: 100vw;
        overflow-x: hidden;
      }

      body {
        font-family:
          "Chalkboard SE", "Comic Sans MS", "Segoe Print", sans-serif;
        background: linear-gradient(to bottom, #30b0c7, #40c8e0);
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        position: relative;
        overflow-x: hidden;
      }

      .back-btn {
        position: fixed;
        top: max(20px, env(safe-area-inset-top, 20px));
        left: clamp(10px, 4vw, 24px);
        z-index: 60;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 44px;
        height: 44px;
        background: var(--chip-bg);
        color: var(--chip-text);
        border: 3px solid var(--chip-border);
        border-radius: 50%;
        font-weight: bold;
        font-size: 1.3rem;
        text-decoration: none;
        cursor: pointer;
        transition: transform 0.1s ease;
      }
      .back-btn:active {
        transform: translateY(2px);
      }

      /* decorative */
      .cloud {
        position: absolute;
        top: max(20px, env(safe-area-inset-top, 20px));
        right: clamp(8px, 4vw, 36px);
        width: clamp(70px, 14vw, 130px);
        height: auto;
        pointer-events: none;
        user-select: none;
        z-index: 0;
      }

      .wrap {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 720px;
        padding: max(14px, env(safe-area-inset-top, 14px)) 16px 24px;
        display: flex;
        flex-direction: column;
        align-items: center;
        flex: 1;
      }

      h1 {
        color: #fae207;
        -webkit-text-stroke: 0.8px #f4930b;
        text-align: center;
        font-size: clamp(1.4rem, 5vw, 2.4rem);
        line-height: 1.15;
        margin-bottom: 4px;
      }

      .subtitle {
        color: #ffe0f0;
        font-size: clamp(0.75rem, 2.6vw, 1rem);
        text-align: center;
        margin-bottom: 14px;
      }

      /* top bar: progress + score */
      .topbar {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 14px;
      }

      .progress-track {
        flex: 1;
        height: 14px;
        background: rgba(255, 255, 255, 0.25);
        border-radius: 999px;
        border: 2px solid rgba(255, 255, 255, 0.4);
        overflow: hidden;
      }
      .progress-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, var(--sun), var(--coral));
        border-radius: 999px;
        transition: width 0.35s ease;
      }

      .score-pill {
        flex-shrink: 0;
        background: var(--chip-bg);
        border: 3px solid var(--chip-border);
        color: var(--chip-text);
        border-radius: 999px;
        padding: 4px 14px;
        font-weight: bold;
        font-size: clamp(0.8rem, 2.8vw, 1.05rem);
        white-space: nowrap;
      }

      /* card */
      .card {
        background: var(--card-bg);
        border: 3px solid var(--card-border);
        border-radius: 22px;
        width: 100%;
        padding: clamp(14px, 4vw, 26px);
        box-shadow: 0 10px 0 rgba(0, 0, 0, 0.12);
        position: relative;
      }

      .q-badge {
        position: absolute;
        top: -18px;
        left: 18px;
        background: #0e6e6e;
        color: var(--sun);
        border: 3px solid var(--sun);
        border-radius: 50%;
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.15rem;
        font-weight: bold;
      }

      .instructions {
        text-align: center;
        color: var(--ocean-deep);
        font-weight: bold;
        font-size: clamp(0.85rem, 3vw, 1.05rem);
        margin: 10px 0 18px;
      }

      /* sentence banner */
      .sentence-banner {
        background: var(--chip-bg);
        color: var(--chip-text);
        border: 3px solid var(--chip-border);
        border-radius: 16px;
        padding: clamp(18px, 6vw, 32px) clamp(14px, 4vw, 24px);
        text-align: center;
        font-weight: bold;
        font-size: clamp(1.15rem, 5vw, 1.7rem);
        line-height: 1.35;
        margin-bottom: 20px;
        min-height: 90px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .sentence-banner.correct {
        background: #e9f9f0;
        color: var(--good-dark);
        border-color: var(--good);
      }
      .sentence-banner.wrong {
        background: #fdecea;
        color: var(--bad-dark);
        border-color: var(--bad);
        animation: shake 0.4s ease;
      }

      @media screen and (orientation: landscape) and (max-height: 450px) {
        .rotate-message {
          display: flex;
        }
        .wrap,
        .back-btn {
          display: none;
        }
      }

      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }
        20% {
          transform: translateX(-8px);
        }
        40% {
          transform: translateX(8px);
        }
        60% {
          transform: translateX(-6px);
        }
        80% {
          transform: translateX(6px);
        }
      }

      /* right / wrong buttons */
      .tf-row {
        display: flex;
        gap: 14px;
        margin-bottom: 16px;
      }

      .tf-btn {
        flex: 1;
        font-family: inherit;
        font-weight: bold;
        font-size: clamp(1.1rem, 4.5vw, 1.5rem);
        border: none;
        border-radius: 16px;
        padding: clamp(16px, 5vw, 24px) 10px;
        cursor: pointer;
        color: var(--white);
        transition: transform 0.1s ease;
      }
      .tf-btn:active {
        transform: translateY(3px);
      }
      .tf-btn:disabled {
        opacity: 0.45;
        cursor: default;
      }
      .tf-true {
        background: var(--good);
        box-shadow: 0 5px 0 var(--good-dark);
      }
      .tf-false {
        background: var(--bad);
        box-shadow: 0 5px 0 var(--bad-dark);
      }
      .tf-btn.selected {
        outline: 4px solid var(--sun);
        outline-offset: 2px;
      }

      .btn-row {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
      }

      .action-btn {
        font-family: inherit;
        font-weight: bold;
        font-size: clamp(0.9rem, 3.2vw, 1.1rem);
        border: none;
        border-radius: 14px;
        padding: 12px 22px;
        cursor: pointer;
        color: var(--white);
        transition: transform 0.1s ease;
      }
      .action-btn:active {
        transform: translateY(2px);
      }
      .btn-check {
        background: var(--orange-btn);
        box-shadow: 0 4px 0 var(--orange-dark);
      }
      .btn-next {
        background: var(--good);
        box-shadow: 0 4px 0 var(--good-dark);
        display: none;
      }

      .feedback {
        text-align: center;
        font-weight: bold;
        font-size: clamp(0.95rem, 3.4vw, 1.2rem);
        min-height: 1.6em;
        margin-bottom: 8px;
      }
      .feedback.good {
        color: var(--good);
      }
      .feedback.bad {
        color: var(--bad);
      }
      .fix-line {
        display: none;
        text-align: center;
        color: var(--good-dark);
        background: #e9f9f0;
        border: 3px solid var(--good);
        border-radius: 16px;
        padding: clamp(12px, 3.5vw, 18px) 12px;
        font-weight: bold;
        font-size: clamp(1.3rem, 5.6vw, 1.9rem);
        line-height: 1.3;
        margin-bottom: 16px;
      }

      /* end screen */
      .end-screen {
        display: none;
        text-align: center;
      }
      .end-screen h2 {
        color: #fae207;
        -webkit-text-stroke: 0.8px #f4930b;
        font-size: clamp(1.6rem, 6vw, 2.6rem);
        margin-bottom: 10px;
      }
      .end-screen .big-score {
        font-size: clamp(2.2rem, 9vw, 3.6rem);
        color: var(--ocean-deep);
        font-weight: bold;
        margin-bottom: 6px;
      }
      .end-screen p {
        color: var(--ocean-deep);
        margin-bottom: 20px;
        font-size: clamp(0.9rem, 3vw, 1.1rem);
      }

      .missed-box {
        display: none;
        text-align: left;
        margin-bottom: 20px;
      }
      .missed-box h3 {
        color: var(--ocean-deep);
        text-align: center;
        font-size: clamp(1rem, 3.6vw, 1.25rem);
        margin-bottom: 10px;
      }
      .missed-list {
        max-height: 40vh;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 2px;
      }
      .missed-item {
        background: #fbfbf4;
        border: 3px solid #cfd8dc;
        border-radius: 14px;
        padding: 10px 14px;
        font-weight: bold;
        font-size: clamp(0.95rem, 3.6vw, 1.15rem);
        line-height: 1.35;
      }
      .missed-item .m-bad {
        color: var(--bad-dark);
        text-decoration: line-through;
      }
      .missed-item .m-good {
        color: var(--good-dark);
      }
      .missed-item .m-note {
        color: var(--ocean-deep);
        font-size: 0.85em;
        font-weight: normal;
      }

      @media (orientation: portrait) {
        .topbar {
          margin-top: clamp(60px, 14vw, 110px);
        }
      }
      @media screen and (orientation: portrait) and (max-width: 430px) {
        h1 {
          margin-top: 60px;
        }
      }
    </style>
  </head>

  <body>
    <img class="cloud" src="../images/d4.png" alt="" />
    <a class="back-btn" href="index.html">←</a>

    <div class="rotate-message">
      <p>📱 Please rotate to portrait mode 📱</p>
    </div>

    <div class="wrap">
      <h1>Right or Wrong?</h1>
      <div class="subtitle">Is the sentence right?</div>

      <div class="topbar">
        <div class="progress-track">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="score-pill">⭐ <span id="scoreLabel">0</span> / 16</div>
      </div>

      <!-- GAME CARD -->
      <div class="card" id="gameCard">
        <div class="q-badge" id="qBadge">1</div>
        <div class="instructions">Read the sentence. Is it Right or Wrong?</div>

        <div class="sentence-banner" id="sentenceBanner">Loading…</div>

        <div class="tf-row">
          <button class="tf-btn tf-true" id="trueBtn">✓ Right</button>
          <button class="tf-btn tf-false" id="falseBtn">✗ Wrong</button>
        </div>

        <div class="feedback" id="feedback"></div>
        <div class="fix-line" id="fixLine"></div>

        <div class="btn-row">
          <button class="action-btn btn-next" id="nextBtn">Next →</button>
        </div>
      </div>

      <!-- END SCREEN -->
      <div class="card end-screen" id="endScreen">
        <h2>Great Job! 🎉</h2>
        <div class="big-score" id="finalScore">0 / 16</div>
        <p id="finalMsg">You finished the Right or Wrong challenge!</p>
        <div class="missed-box" id="missedBox">
          <h3>Sentences to practice</h3>
          <div class="missed-list" id="missedList"></div>
        </div>
        <div class="btn-row">
          <button class="action-btn btn-check" id="playAgainBtn">
            ↺ Play Again
          </button>
        </div>
      </div>
    </div>

    <script>
      // ---------- Question bank (Unit 5: like / love / hate + -ing) ----------
      // 15 right, 15 wrong. Wrong sentences have a "fix" shown after answering.
      const SENTENCE_BANK = [
        // ----- RIGHT -----
        { text: "What day is it?", answer: true },
        { text: "What's the date?", answer: true },
        { text: "Do you have a phone?", answer: true },
        { text: "Can you swim?", answer: true },
        { text: "What food do you like?", answer: true },
        { text: "Whose bat is this?", answer: true },
        { text: "What's this?", answer: true },
        { text: "Who is she?", answer: true },
        { text: "Where is the dog?", answer: true },
        { text: "What are they?", answer: true },
        { text: "Do you have a watch?", answer: true },
        { text: "Can you count?", answer: true },
        { text: "It's a tree.", answer: true },
        { text: "She's a student.", answer: true },
        { text: "It's a cloud.", answer: true },

        // ----- WRONG -----
        {
          text: "What day it is?",
          answer: false,
          fix: "What day is it?",
        },
        {
          text: "What's date?",
          answer: false,
          fix: "What's the date?",
        },
        {
          text: "Do you have phone?",
          answer: false,
          fix: "Do you have a phone?",
        },
        {
          text: "Can you swims?",
          answer: false,
          fix: "Can you swim?",
        },
        {
          text: "What food you like?",
          answer: false,
          fix: "What food do you like?",
        },
        {
          text: "Who's bat is this?",
          answer: false,
          fix: "Whose bat is this?",
        },
        {
          text: "What this is?",
          answer: false,
          fix: "What's this?",
        },
        {
          text: "Who she is?",
          answer: false,
          fix: "Who is she?",
        },
        {
          text: "Where the dog is?",
          answer: false,
          fix: "Where is the dog?",
        },
        {
          text: "What is they?",
          answer: false,
          fix: "What are they?",
        },
        {
          text: "Do you has a watch?",
          answer: false,
          fix: "Do you have a watch?",
        },
        {
          text: "Can you counts?",
          answer: false,
          fix: "Can you count?",
        },
        {
          text: "It's tree.",
          answer: false,
          fix: "It's a tree.",
        },
        {
          text: "She's student.",
          answer: false,
          fix: "She's a student.",
        },
        {
          text: "It's a clouds.",
          answer: false,
          fix: "It's a cloud.",
        },
      ];

      const ROUND_SIZE = 16;

      // ---------- State ----------
      let roundQuestions = [];
      let qIndex = 0;
      let score = 0;
      let answered = false;
      let missed = [];

      const sentenceBanner = document.getElementById("sentenceBanner");
      const feedback = document.getElementById("feedback");
      const fixLine = document.getElementById("fixLine");
      const qBadge = document.getElementById("qBadge");
      const progressFill = document.getElementById("progressFill");
      const scoreLabel = document.getElementById("scoreLabel");
      const trueBtn = document.getElementById("trueBtn");
      const falseBtn = document.getElementById("falseBtn");
      const nextBtn = document.getElementById("nextBtn");
      const gameCard = document.getElementById("gameCard");
      const endScreen = document.getElementById("endScreen");

      function shuffle(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      function startGame() {
        roundQuestions = shuffle(SENTENCE_BANK).slice(0, ROUND_SIZE);
        qIndex = 0;
        score = 0;
        missed = [];
        scoreLabel.textContent = "0";
        endScreen.style.display = "none";
        gameCard.style.display = "block";
        loadQuestion();
      }

      function currentQuestion() {
        return roundQuestions[qIndex];
      }

      function loadQuestion() {
        answered = false;
        feedback.textContent = "";
        feedback.className = "feedback";
        fixLine.textContent = "";
        fixLine.style.display = "none";
        sentenceBanner.className = "sentence-banner";
        nextBtn.style.display = "none";
        trueBtn.disabled = false;
        falseBtn.disabled = false;
        trueBtn.classList.remove("selected");
        falseBtn.classList.remove("selected");

        qBadge.textContent = qIndex + 1;
        progressFill.style.width = `${(qIndex / ROUND_SIZE) * 100}%`;

        sentenceBanner.textContent = currentQuestion().text;
      }

      function submitAnswer(choice) {
        if (answered) return;
        answered = true;

        const q = currentQuestion();
        const isCorrect = choice === q.answer;
        trueBtn.disabled = true;
        falseBtn.disabled = true;
        (choice ? trueBtn : falseBtn).classList.add("selected");

        if (isCorrect) {
          sentenceBanner.classList.add("correct");
          feedback.textContent = "✅ Correct! Well done!";
          feedback.className = "feedback good";
          playCorrectSound();
          score++;
          scoreLabel.textContent = score;
        } else {
          sentenceBanner.classList.add("wrong");
          missed.push(q);
          const correctWord = q.answer ? "Right" : "Wrong";
          feedback.textContent = `❌ Not quite — that sentence was ${correctWord}.`;
          feedback.className = "feedback bad";
          playIncorrectSound();
        }

        if (!q.answer && q.fix) {
          fixLine.textContent = `✏️ ${q.fix}`;
          fixLine.style.display = "block";
        }

        nextBtn.style.display = "inline-block";
      }

      trueBtn.addEventListener("click", () => submitAnswer(true));
      falseBtn.addEventListener("click", () => submitAnswer(false));

      nextBtn.addEventListener("click", () => {
        qIndex++;
        if (qIndex >= ROUND_SIZE) {
          finishGame();
        } else {
          loadQuestion();
        }
      });

      function finishGame() {
        progressFill.style.width = "100%";
        gameCard.style.display = "none";
        endScreen.style.display = "block";
        document.getElementById("finalScore").textContent =
          `${score} / ${ROUND_SIZE}`;
        const pct = Math.round((score / ROUND_SIZE) * 100);
        let msg = "Nice try — keep practicing like, love and hate + -ing!";
        if (pct === 100) msg = "Perfect score! You're a Grammar Detective! 🏆";
        else if (pct >= 80)
          msg = "Awesome work! You really know your grammar! 🌟";
        else if (pct >= 50)
          msg = "Good effort! A little more practice and you'll ace it!";
        document.getElementById("finalMsg").textContent = msg;

        // list of sentences answered wrongly
        const missedBox = document.getElementById("missedBox");
        const missedList = document.getElementById("missedList");
        missedList.innerHTML = "";
        missed.forEach((q) => {
          const item = document.createElement("div");
          item.className = "missed-item";
          if (q.answer) {
            const good = document.createElement("div");
            good.className = "m-good";
            good.textContent = "✓ " + q.text;
            const note = document.createElement("div");
            note.className = "m-note";
            note.textContent = "This sentence was Right.";
            item.append(good, note);
          } else {
            const bad = document.createElement("div");
            bad.className = "m-bad";
            bad.textContent = "✗ " + q.text;
            const good = document.createElement("div");
            good.className = "m-good";
            good.textContent = "✓ " + q.fix;
            item.append(bad, good);
          }
          missedList.appendChild(item);
        });
        missedBox.style.display = missed.length ? "block" : "none";
      }

      document
        .getElementById("playAgainBtn")
        .addEventListener("click", startGame);

      // ---------- Sound effects (Web Audio API, no files needed) ----------
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      const audioCtx = new AudioCtx();

      // iPhone fix: Web Audio is muted by the iPhone silent switch and starts
      // "suspended" until a touch. Playing a silent <audio> element switches
      // iOS to "playback" mode, so the beeps are heard even on silent.
      function makeSilentWavUrl() {
        const rate = 8000;
        const n = rate / 2; // 0.5 s
        const buf = new ArrayBuffer(44 + n);
        const v = new DataView(buf);
        const w = (o, str) =>
          [...str].forEach((c, k) => v.setUint8(o + k, c.charCodeAt(0)));
        w(0, "RIFF");
        v.setUint32(4, 36 + n, true);
        w(8, "WAVE");
        w(12, "fmt ");
        v.setUint32(16, 16, true);
        v.setUint16(20, 1, true); // PCM
        v.setUint16(22, 1, true); // mono
        v.setUint32(24, rate, true);
        v.setUint32(28, rate, true);
        v.setUint16(32, 1, true);
        v.setUint16(34, 8, true); // 8-bit
        w(36, "data");
        v.setUint32(40, n, true);
        for (let k = 0; k < n; k++) v.setUint8(44 + k, 128); // silence
        return URL.createObjectURL(new Blob([buf], { type: "audio/wav" }));
      }
      const silentEl = new Audio(makeSilentWavUrl());
      silentEl.loop = true;
      silentEl.setAttribute("playsinline", "");

      function unlockAudio() {
        if (audioCtx.state !== "running") audioCtx.resume();
        silentEl.play().catch(() => {});
      }
      ["pointerdown", "touchend", "click"].forEach((ev) =>
        document.addEventListener(ev, unlockAudio, { passive: true }),
      );
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          silentEl.pause();
        } else {
          unlockAudio();
        }
      });

      function beep(
        freq,
        duration,
        type = "sine",
        startDelay = 0,
        volume = 0.25,
      ) {
        const play = () => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = type;
          osc.frequency.value = freq;
          osc.connect(gain);
          gain.connect(audioCtx.destination);

          const t0 = audioCtx.currentTime + startDelay;
          gain.gain.setValueAtTime(volume, t0);
          gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);

          osc.start(t0);
          osc.stop(t0 + duration);
        };
        if (audioCtx.state === "running") {
          play();
        } else {
          audioCtx
            .resume()
            .then(play)
            .catch(() => {});
        }
      }

      function playCorrectSound() {
        beep(660, 0.15, "sine", 0, 0.4);
        beep(880, 0.2, "sine", 0.12, 0.4);
      }

      function playIncorrectSound() {
        beep(200, 0.25, "sawtooth", 0, 0.35);
      }

      startGame();
    </script>
  </body>
</html>
